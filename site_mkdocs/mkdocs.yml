site_name: Belsberg Sales Playbook
site_url: https://kaap11.github.io/playbook_test/

# Content (Markdown) en output (GitHub Pages /docs)
docs_dir: docs
site_dir: ../docs
use_directory_urls: false

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.highlight
  palette:
    - scheme: default
      primary: custom
      accent: custom
  font:
    text: Space Grotesk

extra_css:
  - styles/brand.css

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - def_list
  - footnotes
  - sane_lists
  - smarty
  - toc:
      permalink: true
