site_name: Belsberg Sales Playbook
site_url: https://kaap11.github.io/playbook_test/

# Waar de markdowns staan
docs_dir: docs
# MkDocs bouwt direct naar ../docs (GitHub Pages map)
site_dir: ../docs

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.highlight
  palette:
    - scheme: default
      primary: custom
      accent: custom
  font:
    text: Space Grotesk

extra_css:
  - styles/brand.css

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - attr_list
  - def_list
  - footnotes
  - sane_lists
  - smarty

